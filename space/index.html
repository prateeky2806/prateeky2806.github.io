<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prateek Yadav — ML Researcher</title>
  <meta name="description" content="Prateek Yadav — ML Researcher at Meta working on pre-training, RL, modular models, and model merging." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" />
  <link rel="stylesheet" href="css/constellation.css" />
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <!-- Hero -->
  <section id="hero" class="hero-section">
    <div class="hero-content">
      <h1 class="hero-name"></h1>
      <p class="hero-tagline"></p>
      <div class="hero-socials"></div>
      <div id="emailPuzzle" class="email-puzzle-section">
        <div id="puzzleArea" class="puzzle-area"></div>
        <div id="puzzleResult" class="puzzle-result"></div>
      </div>
    </div>
  </section>

  <!-- Navbar -->
  <nav id="navbar" class="navbar">
    <div class="container nav-container">
      <span class="nav-brand">PY</span>
      <div class="nav-links" id="navLinks">
        <a href="#about" class="nav-link" data-section="about"><span class="nav-dot"></span>About</a>
        <span class="nav-line"></span>
        <a href="#career" class="nav-link" data-section="career"><span class="nav-dot"></span>Career</a>
        <span class="nav-line"></span>
        <a href="#publications" class="nav-link" data-section="publications"><span class="nav-dot"></span>Publications</a>
        <span class="nav-line"></span>
        <a href="#news" class="nav-link" data-section="news"><span class="nav-dot"></span>News</a>
        <span class="nav-line"></span>
        <a href="#contact" class="nav-link" data-section="contact"><span class="nav-dot"></span>Contact</a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="#about" class="nav-link" data-section="about">About</a>
      <a href="#career" class="nav-link" data-section="career">Career</a>
      <a href="#publications" class="nav-link" data-section="publications">Publications</a>
      <a href="#news" class="nav-link" data-section="news">News</a>
      <a href="#contact" class="nav-link" data-section="contact">Contact</a>
    </div>
  </nav>

  <!-- About -->
  <section id="about" class="section reveal">
    <div class="container">
      <h2 class="section-title">About</h2>
      <div class="glass-card">
        <div class="about-text"></div>
        <div class="research-interests"></div>
      </div>
    </div>
  </section>

  <!-- Career -->
  <section id="career" class="section reveal">
    <div class="container">
      <h2 class="section-title">Career</h2>
      <div class="career-timeline">
        <div class="career-track"></div>
      </div>
    </div>
  </section>

  <!-- Publications -->
  <section id="publications" class="section reveal">
    <div class="container">
      <h2 class="section-title">Publications</h2>
      <div class="pub-filters">
        <select id="yearFilter" class="filter-select"><option value="all">All Years</option></select>
        <select id="venueFilter" class="filter-select"><option value="all">All Venues</option></select>
        <input type="text" id="searchFilter" class="filter-input" placeholder="Search papers..." />
      </div>
      <div id="pubList" class="pub-list"></div>
      <button id="showMorePubs" class="show-more-btn" style="display:none;">Show all publications</button>
    </div>
  </section>

  <!-- News -->
  <section id="news" class="section reveal">
    <div class="container">
      <h2 class="section-title">News</h2>
      <div class="glass-card">
        <div id="newsList" class="news-list"></div>
        <button id="showMoreNews" class="show-more-btn" style="display:none;">Show all updates</button>
      </div>
    </div>
  </section>

  <!-- Contact -->
  <section id="contact" class="section reveal">
    <div class="container">
      <h2 class="section-title">Get in Touch</h2>
      <div class="contact-grid"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Prateek Yadav</p>
    </div>
  </footer>

  <script src="js/constellation.js"></script>
  <script src="js/email-puzzle.js"></script>
</body>
</html>
